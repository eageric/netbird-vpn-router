# NetBird client used to make this Linux host a routing peer for
# internal resources (VPN-to-Site). Authorized peers send selected internal
# traffic across the overlay, with source NAT (masquerading) on egress.
#
# This file enrolls the peer. It does not publish routes. After the peer
# is connected, create a Network in the NetBird dashboard, assign this
# routing peer, add internal resources, and grant access through policies.
# Leave masquerade enabled. Do not add an exit node or publish default
# routes (0.0.0.0/0 or ::/0). See README.md for setup and verification.
#
# Host networking is required. Forwarded packets have to leave on the
# host's own interfaces, and the client installs its firewall rules in
# the host network namespace. The client turns on IP forwarding itself.
#
# Copy example.env to .env and fill it in before "docker compose up".
# Do not commit .env.
#   NB_SETUP_KEY        setup key from the NetBird dashboard
#   NB_MANAGEMENT_URL   self-hosted management URL, no path
#   NB_HOSTNAME         peer name shown in the dashboard
#   NB_LOG_LEVEL        client log level (default info)
#
# The volume keeps the peer identity. Removing it makes the next start
# register a new peer, which then has to be assigned to the Network again.

name: netbird-${NB_HOSTNAME}

services:
  netbird:
    image: netbirdio/netbird:0.83.0
    container_name: netbird-${NB_HOSTNAME}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY:?Set NB_SETUP_KEY}
      NB_MANAGEMENT_URL: ${NB_MANAGEMENT_URL:?Set NB_MANAGEMENT_URL}
      NB_HOSTNAME: ${NB_HOSTNAME:?Set NB_HOSTNAME}
      NB_LOG_LEVEL: ${NB_LOG_LEVEL:-info}
    volumes:
      - netbird_client:/var/lib/netbird
    healthcheck:
      test: ["CMD", "netbird", "status", "--check", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  netbird_client:
    name: netbird-router
